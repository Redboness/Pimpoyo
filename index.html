<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portada - Pimpoyo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header class="page-header">
            <img src="https://i.postimg.cc/GpMfkzPx/Rat-n-profesor-Copy.png" alt="Logo Pimpoyo" class="logo">
            <h1>Pimpoyo</h1>
            <p class="subtitle">Recursos y enlaces de interés del proyecto de Pimpoyo</p>
        </header>

        <main class="main-content">
            <div class="links-section">
                <h2>Recursos y Enlaces</h2>

                <a href="https://github.com/Redboness/Pimpoyo" target="_blank" rel="noopener noreferrer" class="link-card">
                    <span class="icon">💻</span>
                    <span>Github</span>
                </a>

                <a href="GuiaInformativaPimpoyo.pdf" target="_blank" rel="noopener noreferrer" class="link-card">
                    <span class="icon">📄</span>
                    <span>Guía de usuario</span>
                </a>

                <a href="https://drive.google.com/file/d/1VLsdmZDxlop9Y-SVq7QYy3kHp9aA8fbT/view?usp=sharing" target="_blank" rel="noopener noreferrer" class="link-card">
                    <span class="icon">🎬</span>
                    <span>Vídeo técnico</span>
                </a>

                <a href="TFM_López_Lora_Layda.pdf" class="link-card" target="_blank">
                    <span class="icon">📑</span>
                    <span>Trabajo de Fin de Máster</span>
                </a>
                
                <details class="folder-container">
                    <summary class="link-card folder-summary">
                        <span class="icon">📁</span>
                        <span>Avales de Investigación</span>
                    </summary>
                    <div class="folder-content">
                        <a href="Carta aval investigacion - Velsinia.pdf" class="link-card" target="_blank">
                            <span class="icon">📃</span>
                            <span>Aval de Investigación - IESO Velsinia</span>
                        </a>
                        
                        <a href="Carta aval investigacion - CEIP.pdf" class="link-card" target="_blank">
                            <span class="icon">📃</span>
                            <span>Aval de Investigación - CEIP Eduardo Palomo</span>
                        </a>
                    </div>
                </details>
            </div>
        </main>
    </div>

</body>
</html>
